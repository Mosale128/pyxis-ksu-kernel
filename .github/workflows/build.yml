name: Build Mi 9 Lite KernelSU Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libxml2-utils lzop python2 python3 unzip wget zip

      - name: Checkout Mi 9 Lite (pyxis) Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nE0sIghT/android_kernel_xiaomi_pyxis
          path: kernel
          fetch-depth: 1

      - name: Checkout Proton Clang Compiler
        uses: actions/checkout@v4
        with:
          repository: kdrag0n/proton-clang
          path: clang
          fetch-depth: 1

      - name: Checkout AnyKernel3 Template
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3
          fetch-depth: 1

      - name: Integrate KernelSU & Patch 4.9 Non-GKI Hooks
        working-directory: kernel
        run: |
          KSU_SCRIPT=$(echo "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3RpYW5uL0tlcm5lbFNVL21haW4va2VybmVsL3NldHVwLnNo" | base64 -d)
          curl -LSs "$KSU_SCRIPT" | bash -s v0.9.5

          python3 - << 'PYEOF'
          def patch_file(path, marker, decl, call_target, call_code):
              with open(path, 'r') as f:
                  src = f.read()
              if marker in src:
                  return
              src = src.replace(decl, marker + "\n" + decl, 1)
              idx = src.find(call_target)
              if idx != -1:
                  brace = src.find("{", idx)
                  if brace != -1:
                      src = src[:brace+1] + "\n" + call_code + src[brace+1:]
              with open(path, 'w') as f:
                  f.write(src)

          # 1. fs/exec.c
          patch_file(
              "fs/exec.c",
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);",
              "static int do_execveat_common(",
              "static int do_execveat_common(",
              "#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif"
          )

          # 2. fs/open.c
          patch_file(
              "fs/open.c",
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);",
              "SYSCALL_DEFINE3(faccessat,",
              "SYSCALL_DEFINE3(faccessat,",
              "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif"
          )

          # 3. fs/read_write.c
          patch_file(
              "fs/read_write.c",
              "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);",
              "ssize_t vfs_read(",
              "ssize_t vfs_read(",
              "#ifdef CONFIG_KSU\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif"
          )

          # 4. drivers/input/input.c
          patch_file(
              "drivers/input/input.c",
              "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);",
              "static void input_handle_event(",
              "static void input_handle_event(",
              "#ifdef CONFIG_KSU\n\tksu_handle_input_handle_event(&type, &code, &value);\n#endif"
          )
          PYEOF

          DEFCONFIG=$(find arch/arm64/configs -name "*pyxis*defconfig" | head -n 1)
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_DEBUG=n" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG"
          sed -i 's/DEFAULT_RATE_LIMIT_US.*/DEFAULT_RATE_LIMIT_US (500)/g' kernel/sched/cpufreq_schedutil.c || true

      - name: Compile Kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          DEFCONFIG=$(find arch/arm64/configs -name "*pyxis*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          make O=out ARCH=arm64 "$DEFCONFIG"
          grep -i "CONFIG_KSU" out/.config
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbo.img || make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb

      - name: Package Ready-to-Sideload AnyKernel3 Zip
        run: |
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          sed -i 's/DO_DEVICECHECK=1/DO_DEVICECHECK=0/g' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|BLOCK=/dev/block/bootdevice/by-name/boot;|g' AnyKernel3/anykernel.sh
          sed -i 's/dump_boot;/split_boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/write_boot;/flash_boot;/g' AnyKernel3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cd AnyKernel3 && zip -r9 ../Mi9Lite_KSU_Working.zip *

      - name: Upload Ready Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Mi9Lite_KSU_Working
          path: Mi9Lite_KSU_Working.zip
